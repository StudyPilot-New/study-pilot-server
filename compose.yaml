services:
  gateway:
    build: .
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Configura tu clave en .env del servidor}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      GLOBAL_DAILY_REQUESTS: ${GLOBAL_DAILY_REQUESTS:-3000}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-4}
    volumes:
      - access_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Configura un dominio}
      ACME_EMAIL: ${ACME_EMAIL:?Configura tu correo para certificados}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
volumes:
  access_data:
  caddy_data:
  caddy_config:
